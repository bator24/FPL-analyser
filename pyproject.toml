[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-analyser"
version = "0.1.0"
description = "Expected-points Fantasy Premier League analyser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "scipy>=1.10",
    "pulp>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpl = "fpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
